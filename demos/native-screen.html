<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embassy — la capa de pantalla nativa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Epilogue:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Los archivos reales del repo. Esta demo NO define ni un color ni un tamaño:
     si algo se ve mal acá, está mal en el sistema. -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/composition.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/preview-native.css">
<style>
  /* Lo único que define esta demo es dónde se para el teléfono. Todo lo demás
     —colores, cuerpos, altos, radios— sale de los archivos de arriba. Si algo
     se ve mal acá, está mal en el sistema. */
  body { margin: 0; background: var(--color-surface-container-high);
         display: flex; justify-content: center; padding: 44px 20px 70px; }
</style>
</head>
<body>

<figure class="phone" data-platform="native">
  <div class="phone-status"></div>

  <header class="phone-nav">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <span style="flex-grow:1">Socio</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg>
  </header>

  <div class="phone-screen">
    <div class="screen">

      <!-- §6b·5 · el ancla -->
      <section class="screen-anchor">
        <div class="screen-anchor-top">
          <span class="avatar avatar-lg"><span class="avatar-fallback">LF</span></span>
          <div class="screen-anchor-id">
            <div class="screen-anchor-name">Lucía Ferrari</div>
            <div class="screen-anchor-meta">N° 04182 · Palermo</div>
          </div>
          <span class="badge badge-active">Al día</span>
        </div>
        <div>
          <div class="screen-anchor-row">
            <span class="screen-anchor-figure">9<span> / 12 accesos</span></span>
            <span class="screen-anchor-aside">quedan 3</span>
          </div>
          <div class="progress" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Accesos usados del ciclo">
            <div class="progress-fill" style="width: 75%"></div>
          </div>
        </div>
      </section>

      <!-- un grupo de una sola fila con acción secundaria -->
      <div class="screen-group">
        <div class="screen-item">
          <span class="screen-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><path d="M2 10h20"></path></svg>
          </span>
          <span class="screen-item-body">
            <span class="screen-item-figure">$ 38.400</span>
            <span class="screen-item-sub">Próxima cuota · 19 sep</span>
          </span>
          <button class="screen-inline-action">Ver</button>
        </div>
      </div>

      <!-- §6b·2 + §6b·3 + §6b·4 · sección, grupo y filas -->
      <section class="screen-section">
        <div class="screen-section-header"><span>Plan</span></div>
        <div class="screen-group">
          <div class="screen-row"><span class="screen-row-label">Modalidad</span><span class="screen-row-value">Full anual</span></div>
          <div class="screen-row"><span class="screen-row-label">Accesos</span><span class="screen-row-value">3 por semana</span></div>
          <div class="screen-row"><span class="screen-row-label">Sede habitual</span><span class="screen-row-value">Palermo</span></div>
          <div class="screen-row"><span class="screen-row-label">Medio de pago</span><span class="screen-row-value">Débito ····1841</span></div>
        </div>
      </section>

      <!-- §6b·8 · filas con ícono guía -->
      <section class="screen-section">
        <div class="screen-section-header"><span>Asistencias</span><button class="screen-inline-action">Ver todas</button></div>
        <div class="screen-group">
          <div class="screen-item">
            <span class="screen-item-icon" style="background:var(--color-success-container)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-on-success-container)" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M2 11v2M22 11v2M6 12h12"></path></svg>
            </span>
            <span class="screen-item-body">
              <span class="screen-item-title">Funcional</span>
              <span class="screen-item-sub">Palermo</span>
            </span>
            <span class="screen-item-aside">13 sep<br>07:40</span>
          </div>
          <div class="screen-item">
            <span class="screen-item-icon" style="background:var(--color-primary-container)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-on-primary-container)" stroke-width="2" stroke-linecap="round"><path d="M4 7v10M20 7v10M8 9v6M16 9v6M8 12h8"></path></svg>
            </span>
            <span class="screen-item-body">
              <span class="screen-item-title">Musculación</span>
              <span class="screen-item-sub">Palermo</span>
            </span>
            <span class="screen-item-aside">11 sep<br>19:15</span>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- §6b·6 · la acción primaria, afuera del scroll -->
  <div class="screen-action">
    <button class="btn-primary" style="width:100%">Registrar acceso</button>
  </div>
</figure>

</body>
</html>
